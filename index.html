<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vortex — Downloader TikTok</title>
<link rel="icon" href="/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="hero">
  <svg class="rings" viewBox="0 0 280 280"><circle class="r1" cx="140" cy="140" r="120"/><circle class="r2" cx="140" cy="140" r="90"/><circle class="r3" cx="140" cy="140" r="60"/></svg>
  <div class="topbar">
    <div class="mark"><img src="/logo-64.png" alt="Vortex" class="mark-logo">VORTEX</div>
    <div class="status"><span class="pulse"></span>Online</div>
  </div>
  <h1><b>Downloader TikTok</b><span class="thin">by Vortex</span></h1>
  <div class="chips">
    <div class="chip"><b>HD</b>Kualitas</div>
    <div class="chip"><b>MP4</b>Video</div>
    <div class="chip"><b>MP3</b>Audio</div>
  </div>
</div>

<div class="panel">
  <div class="label">PILIH FORMAT</div>
  <div class="seg">
    <div class="thumb" id="thumb"></div>
    <button class="on" id="segVideo" type="button"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="6"/><path d="M10 8.5l6 3.5-6 3.5v-7z" fill="currentColor" stroke="none"/></svg>Video</button>
    <button id="segAudio" type="button"><svg class="icon" viewBox="0 0 24 24"><circle cx="7" cy="17" r="3"/><circle cx="17" cy="15" r="3"/><path d="M10 17V5l10-2v12"/></svg>MP3</button>
  </div>

  <div class="label">TAUTAN TIKTOK</div>
  <div class="inputbox">
    <input type="text" id="urlInput" placeholder="https://vt.tiktok.com/...">
    <button class="paste" id="pasteBtn" type="button"><svg class="icon" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="4" rx="1"/><path d="M7 5H5a2 2 0 00-2 2v12a2 2 0 002 2h14a2 2 0 002-2V7a2 2 0 00-2-2h-2"/></svg></button>
  </div>

  <button class="cta" id="ctaBtn" type="button">
    <span class="bar"></span>
    <svg class="icon cta-icon" id="ctaIcon" viewBox="0 0 24 24"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z" fill="currentColor" stroke="none"/></svg>
    <span id="ctaText">Proses tautan</span>
  </button>

  <div class="error-box" id="errorBox"></div>

  <div class="result" id="result">
    <div class="rcard">
      <div class="rhead">
        <div class="thumb-ph" id="thumbWrap">
          <img id="resThumb" alt="" style="display:none">
          <svg class="icon" id="thumbIcon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="6"/><path d="M10 8.5l6 3.5-6 3.5v-7z" fill="currentColor" stroke="none"/></svg>
        </div>
        <div class="rinfo">
          <div class="rt" id="resTitle">—</div>
          <div class="ra" id="resAuthor">
            <span class="ra-avatar-wrap">
              <img id="resAuthorAvatar" alt="" style="display:none">
              <svg class="icon" id="resAuthorIcon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.4-4 5-6 7.5-6s6.1 2 7.5 6"/></svg>
            </span>
            <span id="resAuthorText">—</span>
          </div>
          <div class="rstats" id="resStats">
            <span class="stat" id="statLikes"><svg class="icon" viewBox="0 0 24 24"><path d="M12 20s-7-4.35-9.5-8.5C.9 8.2 2.4 5 5.6 5c1.9 0 3.3 1 4.4 2.6C11.1 6 12.5 5 14.4 5c3.2 0 4.7 3.2 3.1 6.5C19.7 15.65 12 20 12 20z" fill="currentColor" stroke="none"/></svg><b>0</b></span>
            <span class="stat" id="statComments"><svg class="icon" viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4V5z"/></svg><b>0</b></span>
          </div>
        </div>
      </div>

      <div class="mediabox" id="mediaBox">
        <div class="video-wrap" id="videoWrap" style="display:none">
          <video id="resVideo" class="preview-video" controls playsinline preload="metadata"></video>
        </div>

        <div class="audioplayer" id="audioPlayer" style="display:none">
          <div class="audio-cover-wrap">
            <img id="audioCover" class="audio-cover" alt="">
            <svg class="icon audio-cover-ph" id="audioCoverPh" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.4-4 5-6 7.5-6s6.1 2 7.5 6"/></svg>
            <div class="audio-spin-ring"></div>
          </div>
          <div class="audio-controls">
            <button class="audio-play" id="audioPlayBtn" type="button">
              <svg class="icon ic-play" viewBox="0 0 24 24"><path d="M8 5l12 7-12 7V5z" fill="currentColor" stroke="none"/></svg>
              <svg class="icon ic-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor" stroke="none"/></svg>
            </button>
            <div class="audio-track">
              <div class="audio-progress" id="audioProgressTrack">
                <div class="audio-bar" id="audioBar"></div>
              </div>
              <div class="audio-time"><span id="audioCur">0:00</span><span id="audioDur">0:00</span></div>
            </div>
          </div>
          <audio id="resAudio" preload="none"></audio>
        </div>
      </div>

      <div class="quality-badge" id="qualityBadge">
        <svg class="icon" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
        <span id="qualityText">HD — kualitas terbaik</span>
      </div>

      <button class="dlbtn" id="dlBtn" type="button">
        <svg class="icon ic-dl" viewBox="0 0 24 24"><path d="M12 3v11m0 0l-4-4m4 4l4-4"/><path d="M5 19h14"/></svg>
        <svg class="icon ic-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
        <span class="dltext">Simpan Video (HD)</span>
      </button>
    </div>
  </div>

  <footer>Powered by Vortex Proxy</footer>
</div>

<script src="/script.js"></script>
</body>
</html>
